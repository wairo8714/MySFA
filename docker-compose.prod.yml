services:
  app:
    image: wairo8714/mysfa_ver2:latest
    container_name: mysfa-app
    platform: linux/arm64
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      DEBUG: ${DEBUG}
      FORCE_HTTPS: ${FORCE_HTTPS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysfa-db
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:alpine
    container_name: mysfa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx-https.conf を conf.d/default.conf としてマウント
      - /home/ec2-user/infrastructure/config/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt の証明書を共有
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["ssl"]

volumes:
  db_data:
