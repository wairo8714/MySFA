version: '3.8'

services:
  app:
    image: wairo8714/mysfa_ver2:latest
    container_name: mysfa-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysfa-db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:alpine
    container_name: mysfa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
     - ./infrastructure/config/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
     - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
     - app
    restart: unless-stopped
    profiles: ["ssl"] #SSL証明書がある場合のみnginxを起動

volumes:
  db_data:
