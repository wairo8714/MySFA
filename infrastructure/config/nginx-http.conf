# nginx-http.conf (ALBでSSL終端を行うため、HTTPのみ)

# ALBからのX-Forwarded-Protoヘッダーを優先、なければ$schemeを使用
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name ${DOMAIN_NAME};
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # ALBからのX-Forwarded-Protoヘッダーを信頼
    # ALBがHTTPSで終端するため、X-Forwarded-Proto: httpsが設定される
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ALBからのX-Forwarded-Protoヘッダーを優先（ALBがHTTPSで終端するためhttpsになる）
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    location /static/ {
        proxy_pass http://app:8000/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        proxy_pass http://app:8000/media/;
        expires 1M;
        add_header Cache-Control "public";
    }
    
    location /health/ {
        proxy_pass http://app:8000/health/;
        access_log off;
    }
}

