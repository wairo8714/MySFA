name: CI/CD Pipeline

on:
  push:
    branches: [ main, deploy/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 依存関係をインストール
        run: |
          pip install -e .[dev]

      - name: コード整形・静的解析を実行
        run: |
          flake8 src/ --max-line-length=88 --ignore=E203,W503
          black --check src/ --line-length 88
          isort --check-only src/ --profile black

      - name: MySQLの起動待機
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h127.0.0.1 -ptest_pass --silent; then
              echo "MySQLサーバーが起動しました。"
              break
            fi
            echo "MySQLサーバーの起動を待機中..."
            sleep 2
          done

      - name: PythonとDjangoのバージョンを表示
        run: |
          echo "PythonおよびDjangoのバージョン情報を表示します。"
          python --version
          which python
          pip --version
          pip freeze
          cd src
          python -m django --version || echo "Djangoがインストールされていません。"

      - name: MySQLサーバーの状態確認
        run: |
          echo "MySQLサーバーの稼働状況を確認します。"
          sudo netstat -tlnp | grep 3306 || echo "ポート3306が開いていません。"
          ps aux | grep mysql

      - name: srcディレクトリの内容を一覧表示
        run: |
          echo "srcディレクトリの内容を確認します。"
          ls -l src || echo "srcディレクトリが存在しません。"

      - name: Djangoマイグレーションの状態を確認（失敗時）
        if: failure()
        run: |
          echo "テスト失敗時にDjangoのマイグレーション状況を表示します。"
          cd src
          python manage.py showmigrations || echo "showmigrationsコマンドの実行に失敗しました。"

      - name: MySQLエラーログの出力（失敗時）
        if: failure()
        run: |
          echo "MySQLのエラーログを出力します。"
          docker logs $(docker ps -q --filter "ancestor=mysql:8.0")

      - name: MySQLユーザー権限を設定
        run: |
          echo "MySQLユーザーの権限を設定します。"
          mysql -h 127.0.0.1 -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'%'; FLUSH PRIVILEGES;"

      - name: コード整形と自動修正
        run: |
          echo "コードの自動整形を実行します。"
          black src/ --line-length 88
          isort src/ --profile black
          flake8 src/ --max-line-length=88 --ignore=E203,W503
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "変更が検出されたため、自動修正をコミットします。"
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add .
            git commit -m "Auto-fix code formatting [skip ci]"
            git push
          else
            echo "修正の必要はありません。"
          fi

      - name: テストの実行
        env:
          SECRET_KEY: test-secret-key
          DEBUG: True
          ALLOWED_HOSTS: localhost,127.0.0.1
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
        run: |
          echo "Djangoのマイグレーションおよびテストを実行します。"
          cd src
          python manage.py migrate
          python manage.py test
