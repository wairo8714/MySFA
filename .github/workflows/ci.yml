name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      MYSQL_DATABASE: test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_pass
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          # Poetry2系ではlockのオプション体系が変わるため、CIでは1系に固定する
          version: "1.8.5"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Lockfile consistency check
        # pyproject.toml と poetry.lock の整合性だけ確認（書き換えない）
        run: poetry lock --check

      # - name: Lint / Format checks
      #   run: |
      #     poetry run flake8 src/
      #     poetry run black --check src/
      #     poetry run isort --check-only src/
          
      # アプリ内の tests.py はここで実行
      - name: Test
        run: poetry run python src/manage.py test

      # steps のどこかで failureとなった場合に実行
      - name: Debug
        if: failure()
        run: |
          poetry run python src/manage.py showmigrations || true
          docker logs ${{ job.services.mysql.id }} || true
