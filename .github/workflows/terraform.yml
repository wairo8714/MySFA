name: Terraform

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  #同一ブランチ内のデプロイを最新分のみ実行 旧デプロイは停止させ、巻き戻しを防ぐ
  group: terraform-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

  TF_VAR_allowed_hosts:   ${{ vars.ALLOWED_HOSTS }}
  TF_VAR_mysql_database:  ${{ vars.MYSQL_DATABASE }}
  TF_VAR_mysql_user:      ${{ vars.MYSQL_USER }}
  TF_VAR_mysql_password:  ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_secret_key:      ${{ secrets.SECRET_KEY }}
  TF_VAR_domain_name:     ${{ vars.DOMAIN_NAME }}
  TF_VAR_s3_bucket_name:  ${{ vars.AWS_STORAGE_BUCKET_NAME }}
  TF_VAR_project_name:    mysfa

jobs:
  terraform:
    runs-on: ubuntu-latest

    # CI 成功時に実行 / フォークPRは弾くことでCIの成功を担保
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'push' ||
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
        run: terraform apply -auto-approve -input=false
