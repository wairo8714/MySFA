name: Terraform

on:
  pull_request:
    branches:
      - main
      - deploy/*
  push:
    branches:
      - main
      - deploy/*

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_allowed_hosts: ${{ secrets.ALLOWED_HOSTS }}
  TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
  TF_VAR_mysql_host: ${{ secrets.MYSQL_HOST }}
  TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
  TF_VAR_mysql_user: ${{ secrets.MYSQL_USER }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
  TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
  TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
  TF_VAR_project_name: mysfa
  AWS_PAGER: ""

jobs:
  terraform-plan:
    name: Terraform プラン作成
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      # ------------------------------------
      # Terraform プラグインキャッシュを利用
      # ------------------------------------
      - name: Terraform プラグインキャッシュ復元
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/*.tf*') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      # plugin-cache の有効化
      - name: Terraform プラグインキャッシュ設定
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      # ------------------------------------
      # Terraform 初期化（キャッシュ再利用あり）
      # ------------------------------------
      - name: Terraform 初期化
        run: terraform init -input=false -no-color

      # ------------------------------------
      # 差分がない場合はスキップ
      # ------------------------------------
      - name: 差分チェック
        id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^infrastructure/terraform/' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip_plan=true" >> $GITHUB_OUTPUT
          else
            echo "skip_plan=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform プラン作成
        if: steps.diff.outputs.skip_plan == 'false'
        id: plan
        run: |
          terraform plan -out=tfplan -input=false -no-color | tee plan_output.txt
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            terraform show -no-color tfplan > plan_details.txt || true
            echo "plan_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "plan_succeeded=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: 変更の有無を確認
        if: steps.diff.outputs.skip_plan == 'false'
        id: check-changes
        run: |
          if [ -f plan_output.txt ] && grep -q "No changes" plan_output.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Plan結果の表示
        if: steps.diff.outputs.skip_plan == 'false'
        run: |
          echo "## Terraform Plan結果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Plan結果をPRにコメント
        if: github.event_name == 'pull_request' && steps.diff.outputs.skip_plan == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const planDetails = fs.existsSync('plan_details.txt') ? fs.readFileSync('plan_details.txt', 'utf8') : '';
            const codeBlock = '```';
            let body = '## Terraform Plan結果\n\n' + codeBlock + '\n' + planOutput + '\n' + codeBlock;
            if (planDetails) {
              body += '\n\n### 詳細な変更内容\n' + codeBlock + '\n' + planDetails + '\n' + codeBlock;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Planファイルをアーティファクトとして保存
        if: github.event_name == 'push' && steps.check-changes.outputs.has_changes == 'true' && steps.plan.outputs.plan_succeeded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform/tfplan
          retention-days: 1
          if-no-files-found: error

      # Terraform の .terraform ディレクトリもキャッシュして apply に再利用
      - name: Terraform 状態キャッシュ保存
        uses: actions/cache@v4
        with:
          path: infrastructure/terraform/.terraform
          key: terraform-state-${{ runner.os }}-${{ hashFiles('**/*.tf*') }}
          restore-keys: terraform-state-${{ runner.os }}-

  terraform-apply:
    name: Terraform 適用
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.terraform-plan.outputs.has_changes == 'true'

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      - name: Terraform プラグインキャッシュ復元
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/*.tf*') }}
          restore-keys: terraform-plugins-${{ runner.os }}-

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform 初期化
        run: terraform init -input=false -no-color

      - name: Planファイルをダウンロード
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform/

      - name: Planファイルがない場合は新規作成
        if: failure()
        run: terraform plan -out=tfplan -input=false -no-color

      - name: Terraform 適用
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform 出力を取得
        if: success()
        id: outputs
        run: |
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV
          echo "TARGET_GROUP_ARN=$(terraform output -raw target_group_arn)" >> $GITHUB_ENV
          echo "ACM_CERT_ARN=$(terraform output -raw acm_certificate_arn)" >> $GITHUB_ENV
          echo "APP_URL=$(terraform output -raw application_url_https)" >> $GITHUB_ENV

      - name: ALB ヘルスチェック
        if: success()
        run: |
          for i in {1..3}; do
            curl -k --fail -s "https://$ALB_DNS_NAME/health/" && exit 0
            sleep 10
          done
          exit 1
