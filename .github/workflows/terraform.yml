name: Terraform

on:
  pull_request:
    branches:
      - main
      - deploy/*

  push:
    branches:
      - main
      - deploy/*

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_allowed_hosts: ${{ secrets.ALLOWED_HOSTS }}
  TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
  TF_VAR_mysql_host: ${{ secrets.MYSQL_HOST }}
  TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
  TF_VAR_mysql_user: ${{ secrets.MYSQL_USER }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
  TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
  TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
  TF_VAR_project_name: mysfa

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform 初期化
        run: terraform init

      # PR / push 共通で plan は実行（失敗したらそこでジョブ中断）
      - name: Terraform プラン
        run: terraform plan -input=false -no-color

      # push のときだけ apply までやる
      - name: Terraform 適用
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
