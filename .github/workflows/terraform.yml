name: Terraform

on:
  pull_request:
    branches:
      - main
      - deploy/*

  push:
    branches:
      - main
      - deploy/*

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_allowed_hosts: ${{ secrets.ALLOWED_HOSTS }}
  TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
  TF_VAR_mysql_host: ${{ secrets.MYSQL_HOST }}
  TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
  TF_VAR_mysql_user: ${{ secrets.MYSQL_USER }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
  TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
  TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
  TF_VAR_project_name: mysfa

jobs:
  terraform-plan:
    name: Terraform プラン作成
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform 初期化
        run: terraform init

      - name: Terraform プラン作成
        id: plan
        run: |
          terraform plan -out=tfplan -input=false -no-color | tee plan_output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          if [ $PLAN_EXIT_CODE -eq 0 ] && [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_details.txt || true
            echo "plan_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "plan_succeeded=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: 変更の有無を確認
        id: check-changes
        run: |
          if [ -f plan_output.txt ]; then
            if grep -q "No changes" plan_output.txt; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Plan結果の表示
        run: |
          echo "## 📋 Terraform Plan結果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f plan_details.txt ]; then
            echo "## 📝 詳細な変更内容" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat plan_details.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Plan結果をPRにコメント
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const planDetails = fs.existsSync('plan_details.txt') 
              ? fs.readFileSync('plan_details.txt', 'utf8') 
              : '';
            
            const codeBlock = '```';
            let body = '## 📋 Terraform Plan結果\n\n' +
              codeBlock + '\n' +
              planOutput + '\n' +
              codeBlock;
            
            if (planDetails) {
              body += '\n\n### 📝 詳細な変更内容\n' +
                codeBlock + '\n' +
                planDetails + '\n' +
                codeBlock;
            }
            
            body += '\n\n---\n*このコメントは自動生成されています*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Planファイルをアーティファクトとして保存
        if: github.event_name == 'push' && steps.check-changes.outputs.has_changes == 'true' && steps.plan.outputs.plan_succeeded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform 適用
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.terraform-plan.outputs.has_changes == 'true'

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform 初期化
        run: terraform init

      - name: Planファイルをダウンロード
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform/

      - name: Planファイルの確認
        run: |
          if [ ! -f tfplan ]; then
            echo "❌ エラー: tfplanファイルが見つかりません。"
            echo "Planが失敗したか、アーティファクトがアップロードされていない可能性があります。"
            exit 1
          fi
          echo "✅ Planファイルが見つかりました。Applyを実行します。"

      - name: Terraform 適用
        run: terraform apply -auto-approve tfplan