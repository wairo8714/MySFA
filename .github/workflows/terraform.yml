name: Terraform

on:
  pull_request:
    branches:
      - main
      - deploy/*
  push:
    branches:
      - main
      - deploy/*

env:
  # Terraform が AWS にアクセスするための認証情報
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  # Terraform 変数に渡すアプリ固有の値
  TF_VAR_allowed_hosts:   ${{ secrets.ALLOWED_HOSTS }}
  TF_VAR_mysql_database:  ${{ secrets.MYSQL_DATABASE }}
  TF_VAR_mysql_user:      ${{ secrets.MYSQL_USER }}
  TF_VAR_mysql_password:  ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_secret_key:      ${{ secrets.SECRET_KEY }}
  TF_VAR_domain_name:     ${{ secrets.DOMAIN_NAME }}
  TF_VAR_s3_bucket_name:  ${{ secrets.S3_BUCKET_NAME }}
  TF_VAR_project_name:    mysfa
  # 必要であれば Terraform 側の debug 変数にも渡す
  # TF_VAR_debug:           ${{ secrets.DEBUG }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: true

      - name: Terraform init
        run: terraform init

      # PR / push 共通で plan は実行（失敗したらそこでジョブ中断）
      - name: Terraform plan
        run: terraform plan -input=false -no-color

      # push のときだけ apply までやる
      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
