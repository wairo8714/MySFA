name: Terraform

on:
  pull_request:
    branches:
      - main
      - deploy/*

  push:
    branches:
      - main
      - deploy/*

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_allowed_hosts: ${{ secrets.ALLOWED_HOSTS }}
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_mysql_host: ${{ secrets.MYSQL_HOST }}
      TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
      TF_VAR_mysql_user: ${{ secrets.MYSQL_USER }}
      TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
      TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
      TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: コードチェックアウト
        uses: actions/checkout@v4

      - name: Terraform インストール
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.6.0, <1.7.0"
          terraform_wrapper: true

      - name: Terraform 初期化
        run: terraform init

      - name: キーペアの確認と作成
        run: |
          # キーペアの存在確認（環境変数AWS_DEFAULT_REGIONを使用）
          KEY_PAIR_EXISTS=$(aws ec2 describe-key-pairs --key-names mysfa-keypair --query 'KeyPairs[0].KeyName' --output text 2>/dev/null || echo "")
          if [ -z "$KEY_PAIR_EXISTS" ] || [ "$KEY_PAIR_EXISTS" = "None" ]; then
            echo "⚠️  Key pair 'mysfa-keypair' not found in AWS, creating..."
            echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/public_key.pub
            aws ec2 import-key-pair --key-name mysfa-keypair --public-key-material fileb:///tmp/public_key.pub 2>&1 || echo "Key pair creation failed or already exists"
            rm -f /tmp/public_key.pub
            # 作成後の確認
            sleep 2
            KEY_PAIR_CHECK=$(aws ec2 describe-key-pairs --key-names mysfa-keypair --query 'KeyPairs[0].KeyName' --output text 2>/dev/null || echo "")
            if [ -n "$KEY_PAIR_CHECK" ] && [ "$KEY_PAIR_CHECK" != "None" ]; then
              echo "✅ Key pair 'mysfa-keypair' successfully created"
            else
              echo "❌ Key pair creation may have failed"
            fi
          else
            echo "✅ Key pair 'mysfa-keypair' already exists in AWS"
          fi

      - name: Terraform プラン作成
        id: plan
        run: |
          terraform plan -out=tfplan -input=false
          # 差分があるか確認
          terraform show -json tfplan | jq -e '.resource_changes | length > 0' && echo "CHANGES=true" >> $GITHUB_ENV || echo "CHANGES=false" >> $GITHUB_ENV

      - name: Terraform Apply（差分がある場合のみ）
        if: env.CHANGES == 'true'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Apply スキップ（差分なし）
        if: env.CHANGES == 'false'
        run: echo "No changes detected, skipping terraform apply."