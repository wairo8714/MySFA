name: AWS へのデプロイ

on:
  push:
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # コードを取得
      - name: コードをチェックアウト
        uses: actions/checkout@v3

      # Python と Poetry のセットアップ
      - name: Python と Poetry をインストール
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # Poetry 仮想環境を作って依存関係をインストール
      - name: Poetry 依存関係のインストール
        run: |
          poetry config virtualenvs.create true
          poetry install --no-root

      # AWS 認証情報の設定
      - name: AWS 認証情報を設定
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # SSH キーのセットアップ
      - name: SSH キーを設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # SSH 接続テスト
      - name: SSH 接続テスト
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH 接続成功'"

      # EC2 にデプロイ（Nginx と Docker の停止・クリーンアップ、コンテナ起動）
      - name: EC2 にデプロイ
        run: |
          set -e
          # Nginx と Docker の停止・クリーンアップ
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "sudo systemctl stop nginx || true &&
             sudo pkill nginx || true &&
             sudo fuser -k 443/tcp || true &&
             sudo docker system prune -a --volumes --force || true &&
             sudo docker stop mysfa-app mysfa-db mysfa-nginx || true &&
             sudo docker rm mysfa-app mysfa-db mysfa-nginx || true"

          # secrets を反映した docker-compose ファイルを作成して転送
          sed -e "s|\${SECRET_KEY}|${{ secrets.SECRET_KEY }}|g" \
              -e "s|\${DEBUG}|${{ secrets.DEBUG }}|g" \
              -e "s|\${ALLOWED_HOSTS}|${{ secrets.ALLOWED_HOSTS }}|g" \
              -e "s|\${MYSQL_HOST}|${{ secrets.MYSQL_HOST }}|g" \
              -e "s|\${MYSQL_PORT}|${{ secrets.MYSQL_PORT }}|g" \
              -e "s|\${MYSQL_DATABASE}|${{ secrets.MYSQL_DATABASE }}|g" \
              -e "s|\${MYSQL_USER}|${{ secrets.MYSQL_USER }}|g" \
              -e "s|\${MYSQL_PASSWORD}|${{ secrets.MYSQL_PASSWORD }}|g" \
              -e "s|\${MYSQL_ROOT_PASSWORD}|${{ secrets.MYSQL_ROOT_PASSWORD }}|g" \
              -e "s|\${FORCE_HTTPS}|${{ secrets.FORCE_HTTPS }}|g" \
              docker-compose.prod.yml > docker-compose.prod.tmp.yml

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            docker-compose.prod.tmp.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

          # コンテナを起動
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml up -d"

      # Linter と Formatter のチェック（dev 依存関係）
      - name: Linter と Formatter のチェック
        run: |
          poetry install --only=dev
          poetry run flake8 src/ --max-line-length=88 --ignore=E203,W503
          poetry run black --check src/ --line-length 88
          poetry run isort --check-only src/ --profile black
