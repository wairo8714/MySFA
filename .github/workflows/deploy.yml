  name: Deploy to AWS

on:
  push:
    branches: [ main, deploy/* ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'" || {
              echo "SSH connection failed"
              exit 1
            }

      - name: Generate environment file
        run: |
          cat > .env.prod <<EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          MYSQL_HOST=${{ secrets.MYSQL_HOST }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}
          EOF

      - name: Upload environment and compose files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            .env.prod ec2-user@${{ secrets.EC2_HOST }}:/tmp/.env.prod

          cat docker-compose.prod.yml | tr -d '\r' > docker-compose.prod.tmp.yml
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            docker-compose.prod.tmp.yml ec2-user@${{ secrets.EC2_HOST }}:/tmp/docker-compose.prod.yml

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            sudo mv /tmp/docker-compose.prod.yml /home/ec2-user/docker-compose.prod.yml && \
            sudo mv /tmp/.env.prod /home/ec2-user/.env.prod && \
            sudo chown ec2-user:ec2-user /home/ec2-user/docker-compose.prod.yml /home/ec2-user/.env.prod
          "

      - name: Deploy application to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            sudo docker compose -f /home/ec2-user/docker-compose.prod.yml down || true
            cd /home/ec2-user && sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
          "

      - name: Setup SSL certificate on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            sudo amazon-linux-extras install -y epel
            sudo yum install -y certbot

            DOMAIN=mysfa.net
            EMAIL=admin@mysfa.net

            if [ ! -d /etc/letsencrypt/live/\$DOMAIN ]; then
              sudo certbot certonly --standalone --non-interactive --agree-tos --email \$EMAIL -d \$DOMAIN || echo 'Certificate generation failed'
            else
              sudo certbot renew --quiet || echo 'Renewal failed'
            fi
          "

      - name: Upload Nginx configuration and start Nginx
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }}"
          SCP_CMD="scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa"

          if $SSH_CMD "sudo test -d /etc/letsencrypt/live/mysfa.net"; then
            sed 's/${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-https.conf | \
              $SCP_CMD - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          else
            sed 's/${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-simple.conf | \
              $SCP_CMD - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          fi

          $SSH_CMD "
            cd /home/ec2-user && \
            sudo docker compose -f docker-compose.prod.yml --profile ssl up -d nginx
          "

      - name: Health check
        run: |
          sleep 10
          if curl -fsSL -k https://mysfa.net > /dev/null 2>&1; then
            echo "HTTPS health check passed"
          elif curl -fsSL http://mysfa.net > /dev/null 2>&1; then
            echo "HTTP health check passed"
          else
            echo "Health check failed"
            exit 1
          fi

          echo "Deployment completed successfully"
