name: Deploy to AWS

on:
  push:
    branches: [ main, 'deploy/*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip setuptools
          pip install poetry

      - name: Setup Poetry and install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry install --only=main --no-root

      - name: Run linters and formatters
        run: |
          poetry install --only=dev
          poetry run flake8 src/ --max-line-length=88 --ignore=E203,W503
          poetry run black --check src/ --line-length 88
          poetry run isort --check-only src/ --profile black

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy to EC2
        run: |
          # Stop old containers and clean up
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} bash <<'EOF'
docker-compose -f /home/ec2-user/docker-compose.prod.yml down || true
docker system prune -a --volumes --force || true
EOF

          # Generate docker-compose.prod.yml with secrets
          sed -e "s|\${SECRET_KEY}|${{ secrets.SECRET_KEY }}|g" \
              -e "s|\${DEBUG}|${{ secrets.DEBUG }}|g" \
              -e "s|\${ALLOWED_HOSTS}|${{ secrets.ALLOWED_HOSTS }}|g" \
              -e "s|\${MYSQL_HOST}|${{ secrets.MYSQL_HOST }}|g" \
              -e "s|\${MYSQL_PORT}|${{ secrets.MYSQL_PORT }}|g" \
              -e "s|\${MYSQL_DATABASE}|${{ secrets.MYSQL_DATABASE }}|g" \
              -e "s|\${MYSQL_USER}|${{ secrets.MYSQL_USER }}|g" \
              -e "s|\${MYSQL_PASSWORD}|${{ secrets.MYSQL_PASSWORD }}|g" \
              -e "s|\${MYSQL_ROOT_PASSWORD}|${{ secrets.MYSQL_ROOT_PASSWORD }}|g" \
              -e "s|\${FORCE_HTTPS}|${{ secrets.FORCE_HTTPS }}|g" \
              docker-compose.prod.yml > docker-compose.prod.tmp.yml

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            docker-compose.prod.tmp.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

          # Start containers
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml up -d"
