name: Deploy to AWS

on:
  push:
    branches: [ main, deploy/* ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (main + dev)
        run: |
          poetry config virtualenvs.create false
          poetry install --all-extras

      - name: Lint & Format check
        run: |
          flake8 src/ --max-line-length=88 --ignore=E203,W503
          black --check src/ --line-length 88
          isort --check-only src/ --profile black

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy to EC2
        run: |
          set -x
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            # Stop host Nginx
            sudo systemctl stop nginx || true
            sudo systemctl disable nginx || true
            sudo pkill nginx || true
            sudo fuser -k 443/tcp || true

            # Docker cleanup
            sudo docker system prune -a --volumes --force || true

            # Stop and remove old containers
            sudo docker stop mysfa-app mysfa-db mysfa-nginx || true
            sudo docker rm mysfa-app mysfa-db mysfa-nginx || true

            # Upload docker-compose.prod.yml
            # Replace environment variables inline
            cat > docker-compose.prod.yml << EOL
${{ secrets.DOCKER_COMPOSE_CONTENT }}
EOL

            sudo docker-compose -f docker-compose.prod.yml up -d

            # SSL setup
            sudo amazon-linux-extras install -y epel
            sudo yum install -y certbot
            if [ ! -d /etc/letsencrypt/live/mysfa.net ]; then
              sudo certbot certonly --standalone --non-interactive --agree-tos --email admin@mysfa.net -d mysfa.net || true
            fi

            # Nginx config
            if [ -d /etc/letsencrypt/live/mysfa.net ]; then
              sed 's/\${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-https.conf > /tmp/nginx.conf
            else
              sed 's/\${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-simple.conf > /tmp/nginx.conf
            fi
            scp /tmp/nginx.conf ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
            sudo docker-compose -f docker-compose.prod.yml --profile ssl up -d nginx

            # Health check
            sleep 10
            curl -f -k https://mysfa.net || curl -f http://mysfa.net
          EOF
