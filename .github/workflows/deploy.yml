name: Deploy to AWS

on:
  push:
    branches: [ main, deploy/* ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      DOMAIN_NAME: mysfa.net
      EMAIL: admin@mysfa.net

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: AWS認証情報を設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSHの設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH接続テスト
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH接続に成功しました'"

      - name: docker-composeファイルをEC2にアップロード
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

      - name: アプリケーションをデプロイ（Secrets直渡し）
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          FORCE_HTTPS: ${{ secrets.FORCE_HTTPS }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            cd /home/ec2-user
            echo 'Dockerコンテナを停止しています...'
            sudo docker compose -f docker-compose.prod.yml down || true

            echo '新しい環境変数を設定し、コンテナを起動します...'
            export SECRET_KEY='${SECRET_KEY}'
            export DEBUG='${DEBUG}'
            export ALLOWED_HOSTS='${ALLOWED_HOSTS}'
            export MYSQL_HOST='${MYSQL_HOST}'
            export MYSQL_PORT='${MYSQL_PORT}'
            export MYSQL_DATABASE='${MYSQL_DATABASE}'
            export MYSQL_USER='${MYSQL_USER}'
            export MYSQL_PASSWORD='${MYSQL_PASSWORD}'
            export MYSQL_ROOT_PASSWORD='${MYSQL_ROOT_PASSWORD}'
            export FORCE_HTTPS='${FORCE_HTTPS}'
            sudo -E docker compose -f docker-compose.prod.yml up -d --build
          "

      - name: SSL証明書をセットアップ
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            echo 'SSL証明書の確認・更新を行います...'

            if command -v amazon-linux-extras >/dev/null 2>&1; then
              sudo amazon-linux-extras install -y epel
              sudo yum install -y certbot
            else
              sudo apt-get update && sudo apt-get install -y certbot
            fi

            DOMAIN=${{ env.DOMAIN_NAME }}
            EMAIL=${{ env.EMAIL }}

            if [ ! -d /etc/letsencrypt/live/\$DOMAIN ]; then
              sudo certbot certonly --standalone --non-interactive --agree-tos --email \$EMAIL -d \$DOMAIN || echo '証明書の発行に失敗しました'
            else
              sudo certbot renew --quiet || echo '証明書の更新に失敗しました'
            fi
          "

      - name: Nginx設定をアップロードして再起動
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }}"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa"

          if $SSH "sudo test -d /etc/letsencrypt/live/${{ env.DOMAIN_NAME }}"; then
            sed 's/${DOMAIN_NAME}/${{ env.DOMAIN_NAME }}/g' infrastructure/config/nginx-https.conf | \
              $SCP - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          else
            sed 's/${DOMAIN_NAME}/${{ env.DOMAIN_NAME }}/g' infrastructure/config/nginx-simple.conf | \
              $SCP - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          fi

          $SSH "
            cd /home/ec2-user
            echo 'Nginxを再起動します...'
            sudo -E docker compose -f docker-compose.prod.yml --profile ssl up -d nginx
          "

      - name: ヘルスチェック
        run: |
          echo "サービスの起動を待機中..."
          sleep 30
          if curl -fsSL -k https://${{ env.DOMAIN_NAME }} > /dev/null 2>&1; then
            echo "HTTPS経由でのヘルスチェックに成功しました。"
          elif curl -fsSL http://${{ env.DOMAIN_NAME }} > /dev/null 2>&1; then
            echo "HTTP経由でのヘルスチェックに成功しました。"
          else
            echo "ヘルスチェックに失敗しました。"
            exit 1
          fi

          echo "デプロイが正常に完了しました。"
