name: Deploy to AWS ECS

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create .env.prod
        run: |
          echo "DEBUG=${{ secrets.DEBUG }}" > .env.prod
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env.prod
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env.prod
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env.prod
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env.prod
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env.prod
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}" >> .env.prod
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.prod
          echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> .env.prod
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> .env.prod
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.prod
          echo "FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}" >> .env.prod
          echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" >> .env.prod
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod

      # -------------------------------
      # デバッグ + 手動ECRログイン
      # -------------------------------
      - name: Manual ECR login (debug mode)
        run: |
          echo "=== AWS Auth Check ==="
          aws sts get-caller-identity

          echo ""
          echo "=== Get Login Password ==="
          TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
          echo "Token length: ${#TOKEN}"

          echo ""
          echo "=== Docker manual login ==="
          docker login -u AWS -p "$TOKEN" "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "✅ Docker login manual succeeded"

      # -------------------------------
      # ECR リポジトリ安定化待ち
      # -------------------------------
      - name: Wait for ECR repository to be ready
        run: |
          echo "⏳ Waiting for ECR repository: ${ECR_REPOSITORY}"
          for i in {1..30}; do
            if aws ecr describe-repositories \
              --repository-names "${ECR_REPOSITORY}" \
              --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "✅ ECR repository '${ECR_REPOSITORY}' is available."
              exit 0
            fi
            echo "  Not found yet. Retry in 10 seconds... (${i}/30)"
            sleep 10
          done
          echo "❌ ECR repository '${ECR_REPOSITORY}' not found after waiting. Check Terraform apply and repository name."
          exit 1

      # -------------------------------
      # Docker build & push
      # -------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      # -------------------------------
      # ECSタスク定義更新
      # -------------------------------
      - name: Register new ECS task definition
        id: ecs-task
        run: |
          MYSQL_PORT_VALUE="${{ secrets.MYSQL_PORT }}"
          if [ -z "$MYSQL_PORT_VALUE" ]; then
            MYSQL_PORT_VALUE="3306"
          fi
          TASK_DEF_JSON=$(aws ecs register-task-definition \
            --family mysfa-task \
            --container-definitions "[{
              \"name\": \"web\",
              \"image\": \"${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest\",
              \"essential\": true,
              \"portMappings\": [{\"containerPort\": 8000, \"hostPort\": 8000}],
              \"environment\": [
                {\"name\": \"SECRET_KEY\", \"value\": \"${{ secrets.SECRET_KEY }}\"},
                {\"name\": \"DEBUG\", \"value\": \"${{ secrets.DEBUG }}\"},
                {\"name\": \"ALLOWED_HOSTS\", \"value\": \"${{ secrets.ALLOWED_HOSTS }}\"},
                {\"name\": \"MYSQL_DATABASE\", \"value\": \"${{ secrets.MYSQL_DATABASE }}\"},
                {\"name\": \"MYSQL_USER\", \"value\": \"${{ secrets.MYSQL_USER }}\"},
                {\"name\": \"MYSQL_PASSWORD\", \"value\": \"${{ secrets.MYSQL_PASSWORD }}\"},
                {\"name\": \"MYSQL_HOST\", \"value\": \"${{ secrets.MYSQL_HOST }}\"},
                {\"name\": \"MYSQL_PORT\", \"value\": \"$MYSQL_PORT_VALUE\"},
                {\"name\": \"S3_BUCKET_NAME\", \"value\": \"${{ secrets.S3_BUCKET_NAME }}\"},
                {\"name\": \"AWS_STORAGE_BUCKET_NAME\", \"value\": \"${{ secrets.S3_BUCKET_NAME }}\"},
                {\"name\": \"AWS_ACCESS_KEY_ID\", \"value\": \"${{ secrets.AWS_ACCESS_KEY_ID }}\"},
                {\"name\": \"AWS_SECRET_ACCESS_KEY\", \"value\": \"${{ secrets.AWS_SECRET_ACCESS_KEY }}\"},
                {\"name\": \"AWS_REGION\", \"value\": \"${{ secrets.AWS_REGION }}\"},
                {\"name\": \"FORCE_HTTPS\", \"value\": \"${{ secrets.FORCE_HTTPS }}\"},
                {\"name\": \"DOMAIN_NAME\", \"value\": \"${{ secrets.DOMAIN_NAME }}\"},
                {\"name\": \"USE_S3\", \"value\": \"true\"}
              ],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"/ecs/mysfa-task\",
                  \"awslogs-region\": \"${{ secrets.AWS_REGION }}\",
                  \"awslogs-stream-prefix\": \"ecs\"
                }
              }
            }]" \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --memory 1024 \
            --cpu 512 \
            --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mysfa-ecs-task-execution-role \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_JSON" >> $GITHUB_ENV

      # -------------------------------
      # ECSサービス更新
      # -------------------------------
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster mysfa-cluster \
            --service mysfa-service \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment
