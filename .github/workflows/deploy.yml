name: AWS Deploy

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed

jobs:
  deploy:
    name: EC2へデプロイ
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: EC2へdocker-compose.prod.ymlと.env.prodを作成
        run: |
          # docker-compose.prod.yml を転送
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

          # .env.prod を一行ずつ作成
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' > /home/ec2-user/.env.prod && \
             echo 'DEBUG=${{ secrets.DEBUG }}' >> /home/ec2-user/.env.prod && \
             echo 'ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_USER=${{ secrets.MYSQL_USER }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_HOST=${{ secrets.MYSQL_HOST }}' >> /home/ec2-user/.env.prod && \
             echo 'MYSQL_PORT=${{ secrets.MYSQL_PORT }}' >> /home/ec2-user/.env.prod && \
             echo 'FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}' >> /home/ec2-user/.env.prod && \
             echo 'S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}' >> /home/ec2-user/.env.prod && \
             echo 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' >> /home/ec2-user/.env.prod && \
             echo 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' >> /home/ec2-user/.env.prod"

      - name: nginx.confの確認と作成（既存インスタンス用）
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "if [ ! -f /home/ec2-user/nginx.conf ]; then
              cat > /home/ec2-user/nginx.conf << 'NGINX_EOF'
          server {
              listen 80;
              server_name ${{ secrets.DOMAIN_NAME }};
              return 301 https://\$server_name\$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name ${{ secrets.DOMAIN_NAME }};

              ssl_certificate /etc/letsencrypt/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${{ secrets.DOMAIN_NAME }}/privkey.pem;

              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers off;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;

              add_header X-Frame-Options DENY;
              add_header X-Content-Type-Options nosniff;
              add_header X-XSS-Protection \"1; mode=block\";
              add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;

              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;

              location / {
                  proxy_pass http://app:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;

                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;

                  proxy_buffering on;
                  proxy_buffer_size 128k;
                  proxy_buffers 4 256k;
                  proxy_busy_buffers_size 256k;
              }

              location /static/ {
                  proxy_pass http://app:8000/static/;
                  expires 1y;
                  add_header Cache-Control \"public, immutable\";
              }

              location /media/ {
                  proxy_pass http://app:8000/media/;
                  expires 1M;
                  add_header Cache-Control \"public\";
              }

              location /health/ {
                  proxy_pass http://app:8000/health/;
                  access_log off;
              }
          }
          NGINX_EOF
              chown ec2-user:ec2-user /home/ec2-user/nginx.conf
              echo 'nginx.confを作成しました'
            else
              echo 'nginx.confは既に存在します'
            fi"

      - name: 古いコンテナ停止と削除
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && \
             sudo docker-compose --env-file /home/ec2-user/.env.prod -f docker-compose.prod.yml down --remove-orphans || true && \
             sudo docker stop mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true && \
             sudo docker rm mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true && \
             sudo docker network prune -f || true"

      - name: アプリとDBとNginxを起動
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && \
             sudo docker-compose --env-file /home/ec2-user/.env.prod -f docker-compose.prod.yml --profile ssl up -d --build"

      - name: ヘルスチェック
        run: |
          for i in {1..6}; do
            if curl -f -k -s https://mysfa.net > /dev/null 2>&1; then
              echo "HTTPS接続成功"
              exit 0
            elif curl -f -s http://mysfa.net > /dev/null 2>&1; then
              echo "HTTP接続成功、HTTPSは未使用"
              exit 0
            else
              echo "接続失敗 $i/6"
              sleep 2
            fi
          done
          echo "ヘルスチェック失敗"
          exit 1