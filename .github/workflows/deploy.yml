name: Deploy to AWS ECS

on:
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches: [ main ]

permissions:
  contents: read
  # JWT の発行許可(writeだが「要求」のみ)
  id-token: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

      ECS_CLUSTER: mysfa-prod-cluster
      ECS_SERVICE: mysfa-prod-service

      # Terraform が実行されたコミットSHAに統一（workflow_runではここが安全）
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

      # run-task 用（カンマ区切り・スペース無し推奨）
      ECS_SUBNET_IDS: ${{ secrets.ECS_SUBNET_IDS }}
      ECS_SECURITY_GROUP_IDS: ${{ secrets.ECS_SECURITY_GROUP_IDS }}
      ECS_ASSIGN_PUBLIC_IP: ${{ secrets.ECS_ASSIGN_PUBLIC_IP || 'DISABLED' }}

      MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/mysfa-github-action-deploy-role
          role-session-name: mysfa-deploy
      #ロールの引き受け確認用 後で削除
      - run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register task definition
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          cat > task-def.json << EOF
          {
            "family": "mysfa-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/mysfa-prod-ecs-task-execution-role",
            "taskRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/mysfa-prod-ecs-task-role",
            "containerDefinitions": [
              {
                "name": "web",
                "image": "${IMAGE_URI}",
                "essential": true,
                "portMappings": [
                  { "containerPort": 80, "protocol": "tcp" }
                ],
                "environment": [
                  { "name": "SECRET_KEY",              "value": "${{ secrets.SECRET_KEY }}" },
                  { "name": "DEBUG",                   "value": "${{ secrets.DEBUG }}" },
                  { "name": "ALLOWED_HOSTS",           "value": "${{ secrets.ALLOWED_HOSTS }}" },

                  { "name": "MYSQL_DATABASE",          "value": "${{ secrets.MYSQL_DATABASE }}" },
                  { "name": "MYSQL_USER",              "value": "${{ secrets.MYSQL_USER }}" },
                  { "name": "MYSQL_PASSWORD",          "value": "${{ secrets.MYSQL_PASSWORD }}" },
                  { "name": "MYSQL_HOST",              "value": "${{ secrets.MYSQL_HOST }}" },
                  { "name": "MYSQL_PORT",              "value": "${MYSQL_PORT}" },

                  { "name": "S3_BUCKET_NAME",          "value": "${{ secrets.S3_BUCKET_NAME }}" },
                  { "name": "AWS_STORAGE_BUCKET_NAME", "value": "${{ secrets.S3_BUCKET_NAME }}" },
                  { "name": "AWS_REGION",              "value": "${AWS_REGION}" },

                  { "name": "FORCE_HTTPS",             "value": "${{ secrets.FORCE_HTTPS }}" },
                  { "name": "DOMAIN_NAME",             "value": "${{ secrets.DOMAIN_NAME }}" },
                  { "name": "USE_S3",                  "value": "true" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/mysfa-prod",
                    "awslogs-region": "${AWS_REGION}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Run management commands (collectstatic & migrate)
        run: |
          set -euo pipefail

          if [ -z "${ECS_SUBNET_IDS}" ] || [ -z "${ECS_SECURITY_GROUP_IDS}" ]; then
            echo "ECS_SUBNET_IDS / ECS_SECURITY_GROUP_IDS が未設定です（カンマ区切り・スペース無し推奨）" >&2
            exit 1
          fi

          run_once () {
            local CMD_JSON=$1

            TASK_ARN=$(aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$TASK_DEF_ARN" \
              --count 1 \
              --network-configuration "awsvpcConfiguration={subnets=[${ECS_SUBNET_IDS}],securityGroups=[${ECS_SECURITY_GROUP_IDS}],assignPublicIp=${ECS_ASSIGN_PUBLIC_IP}}" \
              --overrides "$CMD_JSON" \
              --query 'tasks[0].taskArn' \
              --output text)

            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

            EXIT_CODE=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)

            test "$EXIT_CODE" = "0"
          }

          run_once '{"containerOverrides":[{"name":"web","command":["poetry","run","python","manage.py","collectstatic","--noinput"]}]}' \
            || { echo "collectstatic failed" >&2; exit 1; }

          run_once '{"containerOverrides":[{"name":"web","command":["poetry","run","python","manage.py","migrate","--noinput"]}]}' \
            || { echo "migrate failed" >&2; exit 1; }

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
