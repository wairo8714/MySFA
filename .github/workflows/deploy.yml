name: Deploy to AWS

on:
  push:
    branches: [ main, deploy/* ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Setup Poetry and install dependencies
        run: |
          poetry config virtualenvs.create false
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock not found. Generating..."
            poetry install --only=main --no-root
            poetry lock
          else
            echo "poetry.lock found. Installing dependencies..."
            poetry install --only=main --no-root
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy to EC2
        run: |
          # Create docker-compose.prod.yml with secrets
          sed -e "s|\${SECRET_KEY}|${{ secrets.SECRET_KEY }}|g" \
              -e "s|\${DEBUG}|${{ secrets.DEBUG }}|g" \
              -e "s|\${ALLOWED_HOSTS}|${{ secrets.ALLOWED_HOSTS }}|g" \
              -e "s|\${MYSQL_HOST}|${{ secrets.MYSQL_HOST }}|g" \
              -e "s|\${MYSQL_PORT}|${{ secrets.MYSQL_PORT }}|g" \
              -e "s|\${MYSQL_DATABASE}|${{ secrets.MYSQL_DATABASE }}|g" \
              -e "s|\${MYSQL_USER}|${{ secrets.MYSQL_USER }}|g" \
              -e "s|\${MYSQL_PASSWORD}|${{ secrets.MYSQL_PASSWORD }}|g" \
              -e "s|\${MYSQL_ROOT_PASSWORD}|${{ secrets.MYSQL_ROOT_PASSWORD }}|g" \
              -e "s|\${FORCE_HTTPS}|${{ secrets.FORCE_HTTPS }}|g" \
              docker-compose.prod.yml > docker-compose.prod.tmp.yml

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            docker-compose.prod.tmp.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

          # Execute deployment on EC2 in a single SSH command
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "set -e; \
            sudo systemctl stop nginx 2>/dev/null; \
            sudo systemctl disable nginx 2>/dev/null; \
            sudo pkill nginx 2>/dev/null || true; \
            sudo fuser -k 443/tcp 2>/dev/null || true; \
            sudo docker system prune -a --volumes --force; \
            sudo docker stop mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true; \
            sudo docker rm mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true; \
            cd /home/ec2-user; \
            sudo docker-compose -f docker-compose.prod.yml up -d"

      - name: Run linters and formatters
        run: |
          poetry install --only=dev
          flake8 src/ --max-line-length=88 --ignore=E203,W503
          black --check src/ --line-length 88
          isort --check-only src/ --profile black
