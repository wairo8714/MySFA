name: AWS ECS へのデプロイ

on:
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      AWS_PAGER: ""

    steps:
    # -------------------------------
    # 1. リポジトリのチェックアウト
    # -------------------------------
    - name: リポジトリを取得
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # -------------------------------
    # 2. AWS 認証情報を設定
    # -------------------------------
    - name: AWS 認証を設定
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # -------------------------------
    # 3. 本番環境用 .env ファイル作成
    # -------------------------------
    - name: .env.prod を作成
      run: |
        cat <<EOF > .env.prod
        DEBUG=${{ secrets.DEBUG }}
        ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
        MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
        MYSQL_HOST=${{ secrets.MYSQL_HOST }}
        MYSQL_USER=${{ secrets.MYSQL_USER }}
        MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
        MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
        MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
        S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
        AWS_STORAGE_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
        FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}
        DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION=${{ secrets.AWS_REGION }}
        USE_S3=true
        EOF

    # -------------------------------
    # 4. Amazon ECR にログイン
    # -------------------------------
    - name: ECR にログイン
      uses: aws-actions/amazon-ecr-login@v2

    # -------------------------------
    # 5. Buildx をセットアップ（docker-container ドライバ）
    # -------------------------------
    - name: Buildx セットアップ
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    # -------------------------------
    # 6. start.sh に実行権限を付与
    # -------------------------------
    - name: start.sh の実行権限を付与
      run: chmod +x start.sh

    # -------------------------------
    # 7. ビルド前のECRイメージダイジェストを取得
    # -------------------------------
    - name: ビルド前のイメージダイジェストを取得
      id: digest_before
      run: |
        DIGEST_BEFORE=$(aws ecr describe-images \
          --repository-name ${{ secrets.ECR_REPOSITORY }} \
          --image-ids imageTag=latest \
          --query 'imageDetails[0].imageDigest' \
          --output text 2>/dev/null || echo "NONE")
        echo "digest=$DIGEST_BEFORE" >> $GITHUB_OUTPUT
        echo "ビルド前のイメージダイジェスト: $DIGEST_BEFORE"

    # -------------------------------
    # 8. Docker イメージをビルド・プッシュ（ECR キャッシュ対応）
    # -------------------------------
    - name: Docker イメージをビルドしてプッシュ
      id: build_image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
        cache-from: |
          type=registry,ref=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:cache
          type=registry,ref=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
        cache-to: type=registry,ref=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:cache,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    # -------------------------------
    # 9. 同一イメージの場合は ECS 更新をスキップ
    # -------------------------------
    - name: 同一イメージかを確認
      id: check_image
      run: |
        # ビルド後にECRから最新のイメージのダイジェストを取得（ECRの反映を待つ）
        echo "ECRへのイメージ反映を待機中..."
        for i in {1..10}; do
          DIGEST_AFTER=$(aws ecr describe-images \
            --repository-name ${{ secrets.ECR_REPOSITORY }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "NONE")
          
          if [ "$DIGEST_AFTER" != "NONE" ]; then
            echo "イメージがECRに反映されました。"
            break
          fi
          echo "再試行中... ($i/10)"
          sleep 2
        done
        
        DIGEST_BEFORE="${{ steps.digest_before.outputs.digest }}"
        
        echo "ビルド前のイメージダイジェスト: $DIGEST_BEFORE"
        echo "ビルド後のイメージダイジェスト: $DIGEST_AFTER"
        
        # ダイジェストを比較
        if [ "$DIGEST_BEFORE" = "$DIGEST_AFTER" ] && [ "$DIGEST_BEFORE" != "NONE" ]; then
          echo "イメージに変更がないため、ECS 更新をスキップします。"
          echo "same_image=true" >> $GITHUB_OUTPUT
        else
          echo "新しいイメージが検出されました。ECS を更新します。"
          echo "same_image=false" >> $GITHUB_OUTPUT
        fi

    - name: イメージが同一の場合はデプロイをスキップ
      if: steps.check_image.outputs.same_image == 'true'
      run: |
        echo "イメージに変更がないため、ECS 更新をスキップします。"
        exit 0

    # -------------------------------
    # 9. 新しい ECS タスク定義を登録
    # -------------------------------
    - name: 新しいタスク定義を登録
      id: ecs-task
      run: |
        MYSQL_PORT_VALUE="${{ secrets.MYSQL_PORT }}"
        if [ -z "$MYSQL_PORT_VALUE" ]; then
          MYSQL_PORT_VALUE="3306"
        fi

        TASK_DEF_JSON=$(aws ecs register-task-definition \
          --family mysfa-task \
          --container-definitions "[{
            \"name\": \"web\",
            \"image\": \"${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest\",
            \"essential\": true,
            \"portMappings\": [{\"containerPort\": 80, \"hostPort\": 80}],
            \"environment\": [
              {\"name\": \"SECRET_KEY\", \"value\": \"${{ secrets.SECRET_KEY }}\"},
              {\"name\": \"DEBUG\", \"value\": \"${{ secrets.DEBUG }}\"},
              {\"name\": \"ALLOWED_HOSTS\", \"value\": \"${{ secrets.ALLOWED_HOSTS }}\"},
              {\"name\": \"MYSQL_DATABASE\", \"value\": \"${{ secrets.MYSQL_DATABASE }}\"},
              {\"name\": \"MYSQL_USER\", \"value\": \"${{ secrets.MYSQL_USER }}\"},
              {\"name\": \"MYSQL_PASSWORD\", \"value\": \"${{ secrets.MYSQL_PASSWORD }}\"},
              {\"name\": \"MYSQL_HOST\", \"value\": \"${{ secrets.MYSQL_HOST }}\"},
              {\"name\": \"MYSQL_PORT\", \"value\": \"$MYSQL_PORT_VALUE\"},
              {\"name\": \"S3_BUCKET_NAME\", \"value\": \"${{ secrets.S3_BUCKET_NAME }}\"},
              {\"name\": \"AWS_STORAGE_BUCKET_NAME\", \"value\": \"${{ secrets.S3_BUCKET_NAME }}\"},
              {\"name\": \"AWS_ACCESS_KEY_ID\", \"value\": \"${{ secrets.AWS_ACCESS_KEY_ID }}\"},
              {\"name\": \"AWS_SECRET_ACCESS_KEY\", \"value\": \"${{ secrets.AWS_SECRET_ACCESS_KEY }}\"},
              {\"name\": \"AWS_REGION\", \"value\": \"${{ secrets.AWS_REGION }}\"},
              {\"name\": \"FORCE_HTTPS\", \"value\": \"${{ secrets.FORCE_HTTPS }}\"},
              {\"name\": \"DOMAIN_NAME\", \"value\": \"${{ secrets.DOMAIN_NAME }}\"},
              {\"name\": \"USE_S3\", \"value\": \"true\"}
            ],
            \"healthCheck\": {
              \"command\": [\"CMD-SHELL\", \"curl -f http://localhost:80/health/ || exit 1\"],
              \"interval\": 30,
              \"timeout\": 5,
              \"retries\": 3,
              \"startPeriod\": 60
            },
            \"logConfiguration\": {
              \"logDriver\": \"awslogs\",
              \"options\": {
                \"awslogs-group\": \"/ecs/mysfa-task\",
                \"awslogs-region\": \"${{ secrets.AWS_REGION }}\",
                \"awslogs-stream-prefix\": \"ecs\"
              }
            }
          }]" \
          --requires-compatibilities FARGATE \
          --network-mode awsvpc \
          --memory 1024 \
          --cpu 512 \
          --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mysfa-ecs-task-execution-role \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_JSON" >> $GITHUB_ENV

    # -------------------------------
    # 10. ECS サービスを更新
    # -------------------------------
    - name: ECS サービスを更新
      run: |
        aws ecs update-service \
          --cluster mysfa-cluster \
          --service mysfa-service \
          --task-definition $TASK_DEF_ARN \
          --force-new-deployment

    # -------------------------------
    # 11. jq をインストール（JSON処理用）
    # -------------------------------
    - name: jq をインストール
      run: sudo apt-get update && sudo apt-get install -y jq

    # -------------------------------
    # 12. サービスの安定化を待機
    # -------------------------------
    - name: サービスの安定化を待機
      timeout-minutes: 15
      run: |
        echo "ECS サービスの安定化を待機中..."
        
        # タスクの起動状況を確認
        echo "現在のタスク状態を確認中..."
        aws ecs list-tasks \
          --cluster mysfa-cluster \
          --service-name mysfa-service \
          --desired-status RUNNING \
          --output json || true
        
        # サービスの安定化を待機（最大15分）
        MAX_ATTEMPTS=90
        ATTEMPT=0
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster mysfa-cluster \
            --services mysfa-service \
            --query 'services[0].{runningCount:runningCount,desiredCount:desiredCount,status:status}' \
            --output json)
          
          RUNNING_COUNT=$(echo $SERVICE_STATUS | jq -r '.runningCount // 0')
          DESIRED_COUNT=$(echo $SERVICE_STATUS | jq -r '.desiredCount // 0')
          STATUS=$(echo $SERVICE_STATUS | jq -r '.status // "UNKNOWN"')
          
          echo "試行 $((ATTEMPT + 1))/$MAX_ATTEMPTS: 実行中=$RUNNING_COUNT, 希望=$DESIRED_COUNT, ステータス=$STATUS"
          
          if [ "$RUNNING_COUNT" = "$DESIRED_COUNT" ] && [ "$RUNNING_COUNT" -gt 0 ]; then
            # タスクが起動しているか確認
            TASKS=$(aws ecs list-tasks \
              --cluster mysfa-cluster \
              --service-name mysfa-service \
              --desired-status RUNNING \
              --output json | jq -r '.taskArns[] // empty')
            
            if [ -n "$TASKS" ]; then
              echo "タスクが起動しました。安定化を確認中..."
              sleep 10
              
              # 最終確認: aws ecs wait services-stable を使用
              if aws ecs wait services-stable \
                --cluster mysfa-cluster \
                --services mysfa-service \
                --max-attempts 30 \
                --delay 10 2>/dev/null; then
                echo "✅ ECS サービスが安定しました。"
                exit 0
              fi
            fi
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          sleep 10
        done
        
        echo "❌ サービスの安定化がタイムアウトしました。"
        echo "現在のサービス状態:"
        aws ecs describe-services \
          --cluster mysfa-cluster \
          --services mysfa-service \
          --output json | jq '.services[0]'
        
        echo "タスクの詳細:"
        TASK_ARN=$(aws ecs list-tasks \
          --cluster mysfa-cluster \
          --service-name mysfa-service \
          --output json | jq -r '.taskArns[0] // empty')
        
        if [ -n "$TASK_ARN" ]; then
          aws ecs describe-tasks \
            --cluster mysfa-cluster \
            --tasks $TASK_ARN \
            --output json | jq '.tasks[0] | {lastStatus, desiredStatus, containers[0].{name, lastStatus, reason}}'
        fi
        
        exit 1

    # -------------------------------
    # 13. ヘルスチェック
    # -------------------------------
    - name: 本番環境のヘルスチェック
      run: |
        echo "アプリケーションのヘルスチェックを開始します..."
        for i in {1..5}; do
          if curl --fail -s "https://${DOMAIN_NAME}/health/" > /dev/null; then
            echo "アプリケーションは正常に稼働しています。"
            exit 0
          fi
          echo "再試行します...(10秒後)"
          sleep 10
        done
        echo "ヘルスチェックに失敗しました。"
        exit 1
