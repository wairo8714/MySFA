name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Python のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Poetry のインストール
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Poetry で依存関係をインストール
        run: |
          # 仮想環境を作って dev パッケージもインストール
          poetry config virtualenvs.create true
          poetry install --with dev

      - name: Linter と Formatter チェック
        run: |
          poetry run flake8 src/ --max-line-length=88 --ignore=E203,W503
          poetry run black --check src/ --line-length 88
          poetry run isort --check-only src/ --profile black

      - name: EC2 にデプロイ
        run: |
          # Nginx と Docker の停止・クリーンアップ
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            sudo systemctl stop nginx || true
            sudo pkill nginx || true
            sudo fuser -k 443/tcp || true
            sudo docker system prune -a --volumes --force || true
            sudo docker stop mysfa-app mysfa-db mysfa-nginx || true
            sudo docker rm mysfa-app mysfa-db mysfa-nginx || true
          "

      - name: docker-compose を使ってアプリ起動
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            cd /home/ec2-user
            sudo docker-compose -f docker-compose.prod.yml up -d
          "
