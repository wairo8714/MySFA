name: Deploy to AWS

on:
  push:
    branches: [ main, deploy/* ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Poetry
        run: pip install poetry

      - name: Setup Poetry and generate lock file
        run: |
          # Poetryの設定
          poetry config virtualenvs.create false
          poetry config virtualenvs.in-project false
          
          # プロジェクトの初期化と依存関係の解決
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock not found. Generating..."
            poetry install --only=main --no-root
            poetry lock
          else
            echo "poetry.lock found. Installing dependencies..."
            poetry install --only=main --no-root
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup SSH with debugging
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'" || {
            echo "SSH connection failed"
            exit 1
          }

      - name: Deploy to EC2
        run: |
          set -x
          echo "Starting deployment to EC2..."

          echo "Cleaning up old containers..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "sudo docker stop mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true && sudo docker rm mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true" || { echo "Cleanup failed"; exit 1; }
          echo "Old containers removed"

          # ソースコードはDocker Hubのイメージに含まれているため、アップロード不要

          echo "Uploading .env file..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa .env ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/ || { echo ".env upload failed"; exit 1; }
          echo ".env file uploaded"

          echo "Uploading docker-compose.prod.yml..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa docker-compose.prod.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/ || { echo "docker-compose.prod.yml upload failed"; exit 1; }
          echo "docker-compose.prod.yml uploaded"

          # Docker Hubの既存イメージを使用するため、ビルド不要

          echo "Starting app and database services..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml up -d" || { echo "Docker-compose failed"; exit 1; }
          echo "App and database services started"

          echo "Setting up SSL certificate..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "
            sudo amazon-linux-extras install -y epel
            sudo yum install -y certbot
            if [ ! -d /etc/letsencrypt/live/mysfa.net ]; then
              echo 'Obtaining SSL certificate...'
              sudo certbot certonly --standalone --non-interactive --agree-tos --email admin@mysfa.net -d mysfa.net || echo 'Certificate generation failed'
            else
              echo 'SSL certificate already exists'
            fi
          "

          echo "Uploading Nginx configuration..."
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "sudo test -d /etc/letsencrypt/live/mysfa.net"; then
            echo "SSL certificate found, using HTTPS configuration"
            sed 's/${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-https.conf | scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          else
            echo "No SSL certificate, using HTTP configuration"
            sed 's/${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-simple.conf | scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa - ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          fi

          echo "Starting nginx with SSL..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml --profile ssl up -d nginx" || { echo "Nginx start failed"; exit 1; }
          echo "Nginx started with SSL"

          echo "Performing health check..."
          sleep 10
          if curl -f -k https://mysfa.net 2>/dev/null; then
            echo "HTTPS health check passed"
          elif curl -f http://mysfa.net 2>/dev/null; then
            echo "HTTP health check passed (HTTPS not available)"
          else
            echo "Health check failed"
            exit 1
          fi
          echo "Deployment completed successfully!"