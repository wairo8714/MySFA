name: AWS ECS へのデプロイ

on:
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      AWS_PAGER: ""

    steps:
    # -------------------------------
    # 1. リポジトリのチェックアウト
    # -------------------------------
    - name: リポジトリを取得
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # -------------------------------
    # 2. AWS 認証情報を設定
    # -------------------------------
    - name: AWS 認証を設定
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # -------------------------------
    # 3. 本番環境用 .env ファイル作成
    # -------------------------------
    - name: .env.prod を作成
      run: |
        cat <<EOF > .env.prod
        DEBUG=${{ secrets.DEBUG }}
        ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
        MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
        MYSQL_HOST=${{ secrets.MYSQL_HOST }}
        MYSQL_USER=${{ secrets.MYSQL_USER }}
        MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
        MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
        MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
        S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
        AWS_STORAGE_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
        FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}
        DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION=${{ secrets.AWS_REGION }}
        USE_S3=true
        EOF

    # -------------------------------
    # 4. Amazon ECR にログイン
    # -------------------------------
    - name: ECR にログイン
      uses: aws-actions/amazon-ecr-login@v2

    # -------------------------------
    # 5. Buildx をセットアップ（docker-container ドライバ）
    # -------------------------------
    - name: Buildx セットアップ
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    # -------------------------------
    # 6. start.sh に実行権限を付与
    # -------------------------------
    - name: start.sh の実行権限を付与
      run: chmod +x start.sh

    # -------------------------------
    # 7. Docker イメージをビルド・プッシュ（ECR キャッシュ対応）
    # -------------------------------
    - name: Docker イメージをビルドしてプッシュ
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
        cache-from: type=registry,ref=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:cache
        cache-to: type=registry,ref=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:cache,mode=max

    # -------------------------------
    # 8. 同一イメージの場合は ECS 更新をスキップ
    # -------------------------------
    - name: 同一イメージかを確認
      id: check_image
      run: |
        IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"
        DIGEST_LOCAL=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_URI | cut -d'@' -f2)
        DIGEST_REMOTE=$(aws ecr describe-images --repository-name ${{ secrets.ECR_REPOSITORY }} --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text || echo "NONE")
        echo "ローカルのイメージハッシュ: $DIGEST_LOCAL"
        echo "リモートのイメージハッシュ: $DIGEST_REMOTE"
        if [ "$DIGEST_LOCAL" = "$DIGEST_REMOTE" ]; then
          echo "SAME_IMAGE=true" >> $GITHUB_ENV
        else
          echo "SAME_IMAGE=false" >> $GITHUB_ENV
        fi

    - name: イメージが同一の場合はデプロイをスキップ
      if: env.SAME_IMAGE == 'true'
      run: |
        echo "イメージに変更がないため、ECS 更新をスキップします。"
        exit 0

    # -------------------------------
    # 9. 新しい ECS タスク定義を登録
    # -------------------------------
    - name: 新しいタスク定義を登録
      id: ecs-task
      run: |
        MYSQL_PORT_VALUE="${{ secrets.MYSQL_PORT }}"
        if [ -z "$MYSQL_PORT_VALUE" ]; then
          MYSQL_PORT_VALUE="3306"
        fi

        TASK_DEF_JSON=$(aws ecs register-task-definition \
          --family mysfa-task \
          --container-definitions "[{
            \"name\": \"web\",
            \"image\": \"${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest\",
            \"essential\": true,
            \"portMappings\": [{\"containerPort\": 8000, \"hostPort\": 8000}],
            \"environment\": [
              {\"name\": \"SECRET_KEY\", \"value\": \"${{ secrets.SECRET_KEY }}\"},
              {\"name\": \"DEBUG\", \"value\": \"${{ secrets.DEBUG }}\"},
              {\"name\": \"ALLOWED_HOSTS\", \"value\": \"${{ secrets.ALLOWED_HOSTS }}\"},
              {\"name\": \"MYSQL_DATABASE\", \"value\": \"${{ secrets.MYSQL_DATABASE }}\"},
              {\"name\": \"MYSQL_USER\", \"value\": \"${{ secrets.MYSQL_USER }}\"},
              {\"name\": \"MYSQL_PASSWORD\", \"value\": \"${{ secrets.MYSQL_PASSWORD }}\"},
              {\"name\": \"MYSQL_HOST\", \"value\": \"${{ secrets.MYSQL_HOST }}\"},
              {\"name\": \"MYSQL_PORT\", \"value\": \"$MYSQL_PORT_VALUE\"},
              {\"name\": \"S3_BUCKET_NAME\", \"value\": \"${{ secrets.S3_BUCKET_NAME }}\"},
              {\"name\": \"AWS_ACCESS_KEY_ID\", \"value\": \"${{ secrets.AWS_ACCESS_KEY_ID }}\"},
              {\"name\": \"AWS_SECRET_ACCESS_KEY\", \"value\": \"${{ secrets.AWS_SECRET_ACCESS_KEY }}\"},
              {\"name\": \"AWS_REGION\", \"value\": \"${{ secrets.AWS_REGION }}\"},
              {\"name\": \"FORCE_HTTPS\", \"value\": \"${{ secrets.FORCE_HTTPS }}\"},
              {\"name\": \"DOMAIN_NAME\", \"value\": \"${{ secrets.DOMAIN_NAME }}\"},
              {\"name\": \"USE_S3\", \"value\": \"true\"}
            ],
            \"logConfiguration\": {
              \"logDriver\": \"awslogs\",
              \"options\": {
                \"awslogs-group\": \"/ecs/mysfa-task\",
                \"awslogs-region\": \"${{ secrets.AWS_REGION }}\",
                \"awslogs-stream-prefix\": \"ecs\"
              }
            }
          }]" \
          --requires-compatibilities FARGATE \
          --network-mode awsvpc \
          --memory 1024 \
          --cpu 512 \
          --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mysfa-ecs-task-execution-role \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_JSON" >> $GITHUB_ENV

    # -------------------------------
    # 10. ECS サービスを更新
    # -------------------------------
    - name: ECS サービスを更新
      run: |
        aws ecs update-service \
          --cluster mysfa-cluster \
          --service mysfa-service \
          --task-definition $TASK_DEF_ARN \
          --force-new-deployment

    # -------------------------------
    # 11. サービスの安定化を待機
    # -------------------------------
    - name: サービスの安定化を待機
      run: |
        echo "ECS サービスの安定化を待機中..."
        aws ecs wait services-stable \
          --cluster mysfa-cluster \
          --services mysfa-service
        echo "ECS サービスが安定しました。"

    # -------------------------------
    # 12. ヘルスチェック
    # -------------------------------
    - name: 本番環境のヘルスチェック
      run: |
        echo "アプリケーションのヘルスチェックを開始します..."
        for i in {1..5}; do
          if curl --fail -s "https://${DOMAIN_NAME}/health/" > /dev/null; then
            echo "アプリケーションは正常に稼働しています。"
            exit 0
          fi
          echo "再試行します...(10秒後)"
          sleep 10
        done
        echo "ヘルスチェックに失敗しました。"
        exit 1
