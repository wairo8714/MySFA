name: Deploy to AWS ECS

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      # terraform.yml成功時のコミット(head_sha)でcheckout/イメージタグを揃える
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}

      # IMAGE_URI(Docker Image URI)を環境変数として設定
      - name: Set IMAGE_URI env
        run: |
          echo "IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${DEPLOY_SHA}" >> $GITHUB_ENV

      - name: Register new ECS task definition
        id: ecs-task
        run: |
          cat > task-def.json << EOF
          {
            "family": "mysfa-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/mysfa-prod-ecs-task-execution-role",
            "taskRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/mysfa-prod-ecs-task-role",
            "containerDefinitions": [
              {
                "name": "web",
                "image": "${IMAGE_URI}",
                "essential": true,
                "portMappings": [
                  { "containerPort": 80, "protocol": "tcp" }
                ],
                "environment": [
                  { "name": "SECRET_KEY",             "value": "${{ secrets.SECRET_KEY }}" },
                  { "name": "DEBUG",                  "value": "${{ vars.DEBUG }}" },
                  { "name": "ALLOWED_HOSTS",          "value": "${{ vars.ALLOWED_HOSTS }}" },

                  { "name": "MYSQL_DATABASE",         "value": "${{ vars.MYSQL_DATABASE }}" },
                  { "name": "MYSQL_USER",             "value": "${{ vars.MYSQL_USER }}" },
                  { "name": "MYSQL_PASSWORD",         "value": "${{ secrets.MYSQL_PASSWORD }}" },
                  { "name": "MYSQL_HOST",             "value": "${{ vars.MYSQL_HOST }}" },
                  { "name": "MYSQL_PORT",             "value": "${{ vars.MYSQL_PORT }}" },

                  { "name": "AWS_STORAGE_BUCKET_NAME","value": "${{ vars.AWS_STORAGE_BUCKET_NAME }}" },
                  { "name": "AWS_ACCESS_KEY_ID",      "value": "${{ secrets.AWS_ACCESS_KEY_ID }}" },
                  { "name": "AWS_SECRET_ACCESS_KEY",  "value": "${{ secrets.AWS_SECRET_ACCESS_KEY }}" },
                  { "name": "AWS_REGION",             "value": "${{ vars.AWS_REGION }}" },

                  { "name": "FORCE_HTTPS",            "value": "${{ vars.FORCE_HTTPS }}" },
                  { "name": "DOMAIN_NAME",            "value": "${{ vars.DOMAIN_NAME }}" },
                  { "name": "USE_S3",                 "value": "${{ vars.USE_S3 }}" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/mysfa-prod",
                    "awslogs-region": "${AWS_REGION}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          # タスク定義をECSに登録し、ARNを取得
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
          echo "task_definition_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # collectstaticをECSタスクで実行し、差分や権限問題を解消
      - name: Run collectstatic via ECS task
        env:
          SUBNETS: ${{ vars.ECS_SUBNET_IDS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
        run: |

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "web",
                  "command": ["poetry","run","python","manage.py","collectstatic","--noinput"]
                }
              ]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

        # migrateも同様にECSタスクで実行
      - name: Run migrations via ECS task
        env:
          SUBNETS: ${{ vars.ECS_SUBNET_IDS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "web",
                  "command": ["poetry","run","python","manage.py","migrate","--noinput"]
                }
              ]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment

      # ECS Service 安定待ち
      - name: Wait for ECS service to be stable
        run: |
          echo "ECSサービスが安定するまで待機しています"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          echo "ECSサービスが安定しました。"
