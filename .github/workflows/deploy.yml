name: AWS

on:
  push:
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    name: EC2へデプロイ
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: EC2へdocker-compose.prod.ymlと.env.prodを作成
        run: |
          # docker-compose.prod.yml を転送
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

          # .env.prod を一行ずつ作成（ヒアドキュメントは使わない）
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' > /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'DEBUG=${{ secrets.DEBUG }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_USER=${{ secrets.MYSQL_USER }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_HOST=${{ secrets.MYSQL_HOST }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'MYSQL_PORT=${{ secrets.MYSQL_PORT }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' >> /home/ec2-user/.env.prod"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' >> /home/ec2-user/.env.prod"

      - name: 古いコンテナ停止と削除
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "sudo docker-compose -f /home/ec2-user/docker-compose.prod.yml down || true"

      - name: アプリとDBを起動
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml up -d --build"

      - name: Nginx起動（SSL有効化）
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml --profile ssl up -d"

      - name: ヘルスチェック
        run: |
          for i in {1..6}; do
            if curl -f -k -s https://mysfa.net > /dev/null 2>&1; then
              echo "HTTPS接続成功"
              exit 0
            elif curl -f -s http://mysfa.net > /dev/null 2>&1; then
              echo "HTTP接続成功、HTTPSは未使用"
              exit 0
            else
              echo "接続失敗 $i/6"
              sleep 2
            fi
          done
          echo "ヘルスチェック失敗"
          exit 1
