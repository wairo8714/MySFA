name: Deploy to AWS ECR

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # -------------------------------
    # 1. Secrets 動作確認
    # -------------------------------
    - name: Check AWS secrets are set (length only)
      run: |
        echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
        echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"

    - name: Test AWS credentials
      run: |
        echo "Testing AWS credentials..."
        aws sts get-caller-identity

    # -------------------------------
    # 2. .env.prod 作成
    # -------------------------------
    - name: Create .env.prod
      run: |
        echo "DEBUG=${{ secrets.DEBUG }}" > .env.prod
        echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
        echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env.prod
        echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env.prod
        echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env.prod
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env.prod
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env.prod
        echo "MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}" >> .env.prod
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.prod
        echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> .env.prod
        echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> .env.prod
        echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.prod
        echo "FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}" >> .env.prod
        echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" >> .env.prod
        echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod

    # -------------------------------
    # 3. Login to AWS ECR
    # -------------------------------
    - name: Login to Amazon ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        username: AWS
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # -------------------------------
    # 4. Build and push Docker image
    # -------------------------------
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

    # -------------------------------
    # 5. EC2へデプロイ
    # -------------------------------
    - name: SSH鍵を設定
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: EC2へdocker-compose.prod.ymlと.env.prodを転送
      run: |
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml \
          ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa .env.prod \
          ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/.env.prod

    - name: Nginx設定ファイルを転送と設定（HTTPのみ、ALBでSSL終端）
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "mkdir -p /home/ec2-user/infrastructure/config && \
           sudo chown -R ec2-user:ec2-user /home/ec2-user/infrastructure"
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo rm -rf /home/ec2-user/infrastructure/config/nginx.conf || true"
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa infrastructure/config/nginx-http.conf \
          ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/infrastructure/config/nginx.conf
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sed -i 's/\${DOMAIN_NAME}/${{ secrets.DOMAIN_NAME }}/g' /home/ec2-user/infrastructure/config/nginx.conf && \
           chmod 644 /home/ec2-user/infrastructure/config/nginx.conf && \
           chown ec2-user:ec2-user /home/ec2-user/infrastructure/config/nginx.conf"

    - name: ECRログイン（EC2上）
      run: |
        ECR_PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "echo '$ECR_PASSWORD' | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

    - name: 古いコンテナ停止と削除
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "cd /home/ec2-user && \
           sudo docker-compose --env-file /home/ec2-user/.env.prod -f docker-compose.prod.yml down --remove-orphans || true && \
           sudo docker stop mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true && \
           sudo docker rm mysfa-app mysfa-db mysfa-nginx 2>/dev/null || true && \
           sudo docker network prune -f || true"

    - name: アプリとDBとNginxを起動
      run: |
        ECR_PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} <<EOF
        echo '$ECR_PASSWORD' | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        cd /home/ec2-user
        sudo docker-compose --env-file /home/ec2-user/.env.prod -f docker-compose.prod.yml up -d --pull always
        EOF

    - name: コンテナの状態確認
      run: |
        echo "=== Dockerコンテナの状態 ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'"
        echo ""
        echo "=== Dockerネットワーク ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker network ls && sudo docker network inspect $(sudo docker network ls -q --filter name=mysfa) 2>/dev/null || echo 'No mysfa network found'"

    - name: アプリケーションコンテナのログ確認
      continue-on-error: true
      run: |
        echo "=== mysfa-app コンテナのログ（最新50行） ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker logs mysfa-app --tail 50 2>&1 || echo 'mysfa-app container not found or not running'"
        echo ""
        echo "=== mysfa-app コンテナの詳細情報 ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker inspect mysfa-app --format '{{.State.Status}}' 2>/dev/null || echo 'container not found'"

    - name: データベースコンテナのログ確認
      continue-on-error: true
      run: |
        echo "=== mysfa-db コンテナのログ（最新30行） ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker logs mysfa-db --tail 30 2>&1 || echo 'mysfa-db container not found or not running'"
        echo ""
        echo "=== mysfa-db コンテナの詳細情報 ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker inspect mysfa-db --format '{{.State.Status}}' 2>/dev/null || echo 'container not found'"

    - name: Nginxコンテナのログと設定確認
      continue-on-error: true
      run: |
        echo "=== mysfa-nginx コンテナのログ（最新50行） ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "sudo docker logs mysfa-nginx --tail 50 2>&1 || echo 'mysfa-nginx container not found or not running'"
        echo ""
        echo "=== Nginx設定ファイルの確認 ==="
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
          "cat /home/ec2-user/infrastructure/config/nginx.conf || echo 'nginx.conf not found'"
