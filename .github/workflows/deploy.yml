name: Deploy to AWS ECS

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
    # -------------------------------
    # 0. リポジトリのチェックアウト
    # -------------------------------
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # -------------------------------
    # 1. .env.prod 作成
    # -------------------------------
    - name: Create .env.prod
      run: |
        echo "DEBUG=${{ secrets.DEBUG }}" > .env.prod
        echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
        echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env.prod
        echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env.prod
        echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env.prod
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env.prod
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env.prod
        echo "MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}" >> .env.prod
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.prod
        echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> .env.prod
        echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> .env.prod
        echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.prod
        echo "FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}" >> .env.prod
        echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" >> .env.prod

    # -------------------------------
    # 2. AWS認証デバッグ
    # -------------------------------
    - name: Debug AWS Credentials
      run: |
        echo "=== AWS ENV DEBUG ==="
        echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
        echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"
        echo "AWS_REGION: $AWS_REGION"
        echo ""
        echo "=== STS check ==="
        aws sts get-caller-identity

    # -------------------------------
    # 3. ECR トークン取得（デバッグ付き）
    # -------------------------------
    - name: Get ECR login password
      id: ecr-pass
      run: |
        echo "=== Getting ECR token ==="
        TOKEN=$(aws ecr get-login-password --region $AWS_REGION | tr -d '\n')
        echo "TOKEN length: ${#TOKEN}"
        if [ -z "$TOKEN" ]; then
          echo "ERROR: Failed to retrieve ECR login token"
          exit 1
        fi
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    # -------------------------------
    # 4. ECRログイン（get-login-password使用）
    # -------------------------------
    - name: Login to Amazon ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        username: AWS
        password: ${{ steps.ecr-pass.outputs.token }}

    # -------------------------------
    # 5. Docker イメージビルド & Push
    # -------------------------------
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

    # -------------------------------
    # 6. ECSタスク定義登録
    # -------------------------------
    - name: Register new ECS task definition
      id: ecs-task
      run: |
        TASK_DEF_JSON=$(aws ecs register-task-definition \
          --family my-ecs-task \
          --container-definitions "[
            {
              \"name\": \"my-app\",
              \"image\": \"${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest\",
              \"essential\": true,
              \"portMappings\": [{\"containerPort\": 8000, \"hostPort\": 8000}]
            }
          ]" \
          --requires-compatibilities FARGATE \
          --network-mode awsvpc \
          --memory 512 \
          --cpu 256 \
          --execution-role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskExecutionRole \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "TASK_DEF_ARN=$TASK_DEF_JSON" >> $GITHUB_ENV

    # -------------------------------
    # 7. ECSサービス更新（ローリングデプロイ）
    # -------------------------------
    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster my-ecs-cluster \
          --service my-ecs-service \
          --task-definition $TASK_DEF_ARN \
          --force-new-deployment
