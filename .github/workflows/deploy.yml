name: Deploy to AWS ECR

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    # -------------------------------
    # 0. Debug Secrets
    # -------------------------------
    - name: Debug Environment and Secrets
      run: |
        echo "=== Check Environment Variables ==="
        echo "EC2_HOST length: ${#EC2_HOST}"
        echo "AWS_REGION: $AWS_REGION"
        echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
        echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"
        
        echo ""
        echo "=== Check SSH Private Key ==="
        if [ -z "${SSH_PRIVATE_KEY}" ]; then
          echo "SSH_PRIVATE_KEY is empty!"
        else
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
          echo "First line of SSH_PRIVATE_KEY:"
          echo "$SSH_PRIVATE_KEY" | head -n 1
          echo "Last line of SSH_PRIVATE_KEY:"
          echo "$SSH_PRIVATE_KEY" | tail -n 1
        fi
        
        echo ""
        echo "=== Test SSH key format ==="
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/test_id_rsa
        chmod 600 ~/.ssh/test_id_rsa
        ssh-keygen -y -f ~/.ssh/test_id_rsa >/dev/null 2>&1
        if [ $? -eq 0 ]; then
          echo "SSH_PRIVATE_KEY format seems valid"
        else
          echo "SSH_PRIVATE_KEY format is invalid!"
        fi
        
        echo ""
        echo "=== Test SSH Host reachability ==="
        if [ -z "${EC2_HOST}" ]; then
          echo "EC2_HOST is empty!"
        else
          ssh-keyscan -H "$EC2_HOST" >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "ssh-keyscan succeeded"
          else
            echo "ssh-keyscan failed"
          fi
        fi

    # -------------------------------
    # 1. Secrets 動作確認
    # -------------------------------
    - name: Check AWS secrets are set (length only)
      run: |
        echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
        echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"

    - name: Test AWS credentials
      run: |
        echo "Testing AWS credentials..."
        aws sts get-caller-identity

    # -------------------------------
    # 2. .env.prod 作成
    # -------------------------------
    - name: Create .env.prod
      run: |
        echo "DEBUG=${{ secrets.DEBUG }}" > .env.prod
        echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
        echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env.prod
        echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env.prod
        echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env.prod
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env.prod
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env.prod
        echo "MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}" >> .env.prod
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.prod
        echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> .env.prod
        echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> .env.prod
        echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.prod
        echo "FORCE_HTTPS=${{ secrets.FORCE_HTTPS }}" >> .env.prod
        echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" >> .env.prod
        echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod

    # -------------------------------
    # 3. Login to AWS ECR
    # -------------------------------
    - name: Login to Amazon ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        username: AWS
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # -------------------------------
    # 4. Build and push Docker image
    # -------------------------------
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

    # -------------------------------
    # 5. SSH鍵を設定
    # -------------------------------
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.EC2_HOST }}

    # -------------------------------
    # 6. EC2へdocker-compose.prod.ymlと.env.prodを転送
    # -------------------------------
    - name: Copy docker-compose.prod.yml and .env.prod to EC2
      run: |
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml \
          ec2-user@$EC2_HOST:/home/ec2-user/docker-compose.prod.yml
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa .env.prod \
          ec2-user@$EC2_HOST:/home/ec2-user/.env.prod
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}

# 以下、既存の Nginx 設定、ECRログイン、コンテナ操作のステップも同様に
# 必要に応じて env で EC2_HOST と SSH_PRIVATE_KEY を設定する
