name: AWS

on:
  push:
    branches:
      - main
      - deploy/*

jobs:
  deploy:
    name: EC2へデプロイ
    runs-on: ubuntu-latest

    steps:
      # ソースコードを取得
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      # SSH秘密鍵をセットアップ
      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          echo "SSH鍵のセットアップ完了"

      # EC2上で古いコンテナ停止とDocker環境のクリア
      - name: EC2上の旧コンテナ停止・削除
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "sudo systemctl stop nginx || true && \
             sudo pkill nginx || true && \
             sudo fuser -k 443/tcp || true && \
             sudo docker stop mysfa-app mysfa-db mysfa-nginx || true && \
             sudo docker rm mysfa-app mysfa-db mysfa-nginx || true"
          echo "EC2上の旧コンテナを停止・削除しました。"
          
      # ディスク容量をチェックして必要時のみクリーンアップ
      - name: ディスク容量チェックとクリーンアップ
        run: |
          DISK_USAGE=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ec2-user@${{ secrets.EC2_HOST }} \
            "df -h / | awk 'NR==2 {print \$5}' | sed 's/%//'")
          
          if [ "$DISK_USAGE" -gt 80 ]; then
            echo "ディスク使用率が${DISK_USAGE}%のため、Dockerクリーンアップを実行します。"
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
              ec2-user@${{ secrets.EC2_HOST }} \
              "sudo docker system prune -f || true"
          else
            echo "ディスク使用率は${DISK_USAGE}%です。クリーンアップはスキップします。"
          fi

      # docker-composeファイルをSecrets優先・.env fallbackで生成
      - name: docker-composeファイルを生成
        run: |
          ENV_FILE=".env"
          for VAR in SECRET_KEY DEBUG ALLOWED_HOSTS MYSQL_HOST MYSQL_PORT MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD FORCE_HTTPS AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET_NAME; do
            VAL=${{ secrets[VAR] }} || true
            if [ -z "$VAL" ] && [ -f "$ENV_FILE" ]; then
              VAL=$(grep "^$VAR=" $ENV_FILE | cut -d '=' -f2-)
            fi
            export $VAR="$VAL"
          done

          # docker-compose.prod.yml に置換して生成
          sed -e "s|\${SECRET_KEY}|$SECRET_KEY|g" \
              -e "s|\${DEBUG}|$DEBUG|g" \
              -e "s|\${ALLOWED_HOSTS}|$ALLOWED_HOSTS|g" \
              -e "s|\${MYSQL_HOST}|$MYSQL_HOST|g" \
              -e "s|\${MYSQL_PORT}|$MYSQL_PORT|g" \
              -e "s|\${MYSQL_DATABASE}|$MYSQL_DATABASE|g" \
              -e "s|\${MYSQL_USER}|$MYSQL_USER|g" \
              -e "s|\${MYSQL_PASSWORD}|$MYSQL_PASSWORD|g" \
              -e "s|\${MYSQL_ROOT_PASSWORD}|$MYSQL_ROOT_PASSWORD|g" \
              -e "s|\${FORCE_HTTPS}|$FORCE_HTTPS|g" \
              -e "s|\${AWS_ACCESS_KEY_ID}|$AWS_ACCESS_KEY_ID|g" \
              -e "s|\${AWS_SECRET_ACCESS_KEY}|$AWS_SECRET_ACCESS_KEY|g" \
              -e "s|\${S3_BUCKET_NAME}|$S3_BUCKET_NAME|g" \
              docker-compose.prod.yml > docker-compose.prod.tmp.yml
          echo "docker-compose.prod.tmp.yml を生成しました。"

      # EC2へファイル転送
      - name: docker-composeファイルをEC2へ転送
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            docker-compose.prod.tmp.yml ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml
          echo "docker-composeファイルをEC2へ転送しました。"

      # アプリとDBを起動（既存イメージがあれば再利用、なければpull）
      - name: アプリとDBを起動
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml up -d app db"
          echo "アプリとDBを起動しました。"

      # SSL証明書の設定
      - name: SSL証明書の設定
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "if ! command -v certbot &> /dev/null; then
              sudo amazon-linux-extras install -y epel
              sudo yum install -y certbot
            fi
            if [ ! -d /etc/letsencrypt/live/mysfa.net ]; then
              echo 'SSL証明書を取得中...'
              sudo certbot certonly --standalone --non-interactive --agree-tos --email admin@mysfa.net -d mysfa.net || echo '証明書取得に失敗しました'
            else
              echo 'SSL証明書は既に存在します'
            fi"
          echo "SSL証明書の設定完了"

      # Nginx設定ファイルをアップロード
      - name: Nginx設定ファイルをアップロード
        run: |
          if ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "sudo test -d /etc/letsencrypt/live/mysfa.net"; then
            echo "SSL証明書が見つかりました。HTTPS設定を使用します。"
            sed 's/\${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-https.conf > /tmp/nginx.conf
          else
            echo "SSL証明書が見つかりません。HTTP設定を使用します。"
            sed 's/\${DOMAIN_NAME}/mysfa.net/g' infrastructure/config/nginx-simple.conf > /tmp/nginx.conf
          fi
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            /tmp/nginx.conf ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx.conf
          echo "Nginx設定ファイルをアップロードしました。"

      # Nginxを起動（profile指定が必要）
      - name: Nginxを起動
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user && sudo docker-compose -f docker-compose.prod.yml --profile ssl up -d nginx"
          echo "Nginxを起動しました。"

      # ヘルスチェック
      - name: ヘルスチェック
        run: |
          echo "ヘルスチェックを実行中..."
          sleep 5
          for i in {1..6}; do
            if curl -f -k -s https://mysfa.net > /dev/null 2>&1; then
              echo "HTTPS接続に成功しました"
              exit 0
            elif curl -f -s http://mysfa.net > /dev/null 2>&1; then
              echo "HTTP接続は成功しましたが、HTTPSは利用できません"
              exit 0
            else
              if [ $i -lt 6 ]; then
                echo "ヘルスチェック試行 $i/6 失敗、再試行中..."
                sleep 2
              fi
            fi
          done
          echo "ヘルスチェックに失敗しました"
          exit 1
