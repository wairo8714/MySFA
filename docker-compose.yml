services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mysfa_web_dev
    command: poetry run python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysfa_db_dev
    restart: always
    env_file:
      - .env
    volumes:
      - mysfa_db_data_dev:/var/lib/mysql

volumes:
  mysfa_db_data_dev:
