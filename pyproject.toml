[tool.poetry]
name = "mysfa"
version = "1.0.0"
description = "営業成果共有に特化したWebアプリケーション"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "mysfa", from = "src" },
    { include = "config", from = "src" },
    { include = "accounts", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.0,<5.1"
mysqlclient = ">=2.0"
whitenoise = "*"
python-dotenv = "*"
gunicorn = "*"
pillow = "*"

[tool.poetry.group.dev.dependencies]
flake8 = ">=6.0.0"
black = ">=23.0.0"
isort = ">=5.12.0"
pytest = ">=7.0.0"
pytest-django = ">=4.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Black設定 ---
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | staticfiles
  | media
)/
'''

# --- isort設定 ---
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_first_party = ["accounts", "mysfa", "config"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
